<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Marit's Heart Stone Quest</title>
  <desc id="desc">Et dyprødt hjerte foran et høyt, snødekt fjell og en sol.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#5d9291"/>
      <stop offset="1" stop-color="#163e49"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a9d2cb"/>
      <stop offset="1" stop-color="#3d7775"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ff746d"/>
      <stop offset=".55" stop-color="#ee4050"/>
      <stop offset="1" stop-color="#bd1832"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#102d35" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="25" fill="url(#sky)"/>
  <circle cx="101" cy="30" r="15" fill="#ffe79e"/>
  <path d="M-14 122 64-7l78 129Z" fill="url(#mountain)"/>
  <path d="m64-7 8 39 70 90H64Z" fill="#2d676b" opacity=".54"/>
  <path d="m64-7-28 47 18-13 10 9 14-11 15 14Z" fill="#f5fbef"/>
  <path d="m64-7 14 32-14 11Z" fill="#dcefe7"/>
  <path d="M-10 113 28 83l15 16 20-16 18 16 22-25 35 39v15H-10Z" fill="#275f60" opacity=".82"/>
  <path d="M64 114C47 102 28 91 28 68c0-13 9-22 21-22 7 0 12 4 15 10 3-6 8-10 15-10 12 0 21 9 21 22 0 23-19 34-36 46Z" fill="url(#heart)" stroke="#fff5df" stroke-width="3.5" filter="url(#shadow)"/>
  <path d="M40 63c4-6 10-8 16-4" fill="none" stroke="#fff5e0" stroke-linecap="round" stroke-width="4" opacity=".78"/>
</svg>
